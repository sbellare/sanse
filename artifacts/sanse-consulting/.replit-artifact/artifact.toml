kind = "web"
previewPath = "/"
title = "Sanse | Sustainable Building Consulting"
description = "A modern website for Sanse, a green building consultancy helping owners, architects, and project teams pursue LEED certification and healthier, lower-impact buildings."
version = "1.0.0"
id = "artifacts/sanse-consulting"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23770

[services.development]
run = "pnpm --filter @workspace/sanse-consulting run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sanse-consulting", "run", "build" ]
serve = "static"
publicDir = "artifacts/sanse-consulting/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23770"
BASE_PATH = "/"
