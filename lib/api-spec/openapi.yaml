openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inquiries:
    post:
      operationId: sendInquiry
      tags: [inquiries]
      summary: Send a project inquiry by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "200":
          description: Team notification delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "202":
          description: Inquiry saved and queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "400":
          description: Invalid inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many inquiries from this address
          headers:
            Retry-After:
              description: Seconds until another inquiry can be submitted
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Inquiry could not be saved or was permanently undeliverable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /inquiries/{inquiryId}/status:
    get:
      operationId: getInquiryStatus
      tags: [inquiries]
      summary: Check project inquiry delivery status
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current delivery status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryStatusResponse"
        "404":
          description: Inquiry status not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Status is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InquiryInput:
      type: object
      required: [name, email, project]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        project:
          type: string
          enum:
            - New building
            - Existing building
            - Interior fit-out
            - Campus or portfolio
            - Something else
        stage:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 5000
        website:
          type: string
          maxLength: 500
    InquiryResponse:
      type: object
      required: [success, status]
      properties:
        success:
          type: boolean
        status:
          $ref: "#/components/schemas/InquiryDeliveryStatus"
        inquiryId:
          type: string
          format: uuid
    InquiryStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/InquiryDeliveryStatus"
    InquiryDeliveryStatus:
      type: string
      enum: [pending, delivered, failed]
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        success:
          type: boolean
        status:
          $ref: "#/components/schemas/InquiryDeliveryStatus"
        inquiryId:
          type: string
          format: uuid

