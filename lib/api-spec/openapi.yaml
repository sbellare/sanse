openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /inquiries:
    post:
      operationId: sendInquiry
      tags: [inquiries]
      summary: Send a project inquiry by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InquiryInput"
      responses:
        "200":
          description: Team notification sent; visitor acknowledgment is best-effort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InquiryResponse"
        "400":
          description: Invalid inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Email could not be delivered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InquiryInput:
      type: object
      required: [name, email, project]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        project:
          type: string
          enum:
            - New building
            - Existing building
            - Interior fit-out
            - Campus or portfolio
            - Something else
        stage:
          type: string
          maxLength: 200
        message:
          type: string
          maxLength: 5000
    InquiryResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

